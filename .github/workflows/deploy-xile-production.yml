name: Deploy Xile production Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '確認 Cloudflare DNS、Routes 和 Access 後，輸入 deploy-xile'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xile-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' && inputs.confirm == 'deploy-xile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install and build Worker
        run: |
          npm ci --prefix apps/worker
          npm run build --prefix apps/worker
      - name: Check Wrangler bundle
        run: apps/worker/node_modules/.bin/wrangler deploy --config wrangler.toml --env production --dry-run
      - name: Deploy production Worker with secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EVENT_COOKIE_SECRET: ${{ secrets.EVENT_COOKIE_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/xile-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=commonjs - "$secrets_file" <<'NODE'
          const fs = require('node:fs');
          const names = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID',
            'ADMIN_EMAILS', 'JWT_SECRET', 'EVENT_COOKIE_SECRET'];
          for (const name of names) {
            if (!process.env[name]?.trim()) throw new Error(`Missing secret: ${name}`);
          }
          const { ADMIN_EMAILS, JWT_SECRET, EVENT_COOKIE_SECRET } = process.env;
          if ([JWT_SECRET, EVENT_COOKIE_SECRET].some(value => value.trim().length < 32)) {
            throw new Error('Signing secrets must each contain at least 32 characters');
          }
          fs.writeFileSync(process.argv[2], JSON.stringify({ ADMIN_EMAILS, JWT_SECRET, EVENT_COOKIE_SECRET }));
          NODE
          apps/worker/node_modules/.bin/wrangler deploy --config wrangler.toml --env production --secrets-file "$secrets_file"
