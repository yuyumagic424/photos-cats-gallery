
name = "photos-cats-worker"
main = "./apps/worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Observability
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Scheduled tasks disabled
[triggers]
crons = []

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "photos-cats-db"
database_id = "7b23840f-153d-4c30-8594-4c214044893b"

# R2 photo storage
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "photos-cats-storage"

# Workers AI
[ai]
binding = "AI"

# Local development settings
[vars]
ENVIRONMENT = "development"
APP_NAME = "喜樂相冊"
BRAND_NAME = "喜樂"
COPYRIGHT_HOLDER = "Zhuo YH"
APP_DOMAIN = "localhost:8787"
CONTACT_EMAIL = "contact@example.com"
GA_MEASUREMENT_ID = "G-PLACEHOLDER"

# Development environment
[env.development]
name = "photos-cats-worker-dev"

# ========================================
# Production environment
# ========================================

[env.production]
name = "photos-cats-worker"

routes = [
  { pattern = "xile.zhuoyh.top/api/*", zone_name = "zhuoyh.top" },
  { pattern = "xile.zhuoyh.top/media/*", zone_name = "zhuoyh.top" },
  { pattern = "xile.zhuoyh.top/sitemap.xml", zone_name = "zhuoyh.top" },
  { pattern = "xile.zhuoyh.top/robots.txt", zone_name = "zhuoyh.top" }
]

[env.production.vars]
ENVIRONMENT = "production"
APP_NAME = "喜樂相冊"
BRAND_NAME = "喜樂"
COPYRIGHT_HOLDER = "Zhuo YH"
APP_DOMAIN = "xile.zhuoyh.top"
CONTACT_EMAIL = "contact@example.com"
GA_MEASUREMENT_ID = "G-PLACEHOLDER"

# Disable scheduled tasks
[env.production.triggers]
crons = []

# Production D1
[[env.production.d1_databases]]
binding = "DB"
database_name = "photos-cats-db"
database_id = "7b23840f-153d-4c30-8594-4c214044893b"

# Production R2
[[env.production.r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "photos-cats-storage"

# Production Workers AI
[env.production.ai]
binding = "AI"
